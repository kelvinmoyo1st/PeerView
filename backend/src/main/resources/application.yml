spring:
  application:
    name: peerview
  datasource:
    # TODO(assumption): Local development uses a PostgreSQL database named peerview on localhost.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/peerview}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

peerview:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  cors-origin-patterns: ${CORS_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:*}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  jwt:
    # TODO(assumption): A development fallback keeps local setup simple; deployments must override this value.
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true